<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georgics 1.231–251 — Translation Helper</title>
<style>
:root{
  --rust:#8C3A2B; --slate:#2E4756; --cream:#FBF7F2; --pale:#F3F7F9;
  --ink:#1f2328; --mute:#5c6670; --line:#d9d3c7;
  --green:#2f7d4f; --greenbg:#e8f4ec; --red:#a33a2a; --redbg:#fbeae6;
  --purple:#5b3d8a; --purplebg:#f1ecf8; --gold:#b98a2b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.lat{font-family:Cambria,"Palatino Linotype",Georgia,serif}
header{background:var(--slate);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
header h1 small{display:block;font-weight:400;font-size:12.5px;opacity:.85;margin-top:2px}
.modes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.modes .lbl{opacity:.85}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;opacity:.85}
.seg button.on{background:#fff;color:var(--slate);opacity:1;font-weight:600}
main{max-width:920px;margin:0 auto;padding:18px 16px 80px}

/* index */
.intro{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14.5px}
.intro p{margin:6px 0}
.idx{display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;transition:border-color .15s,transform .1s}
.card:hover{border-color:var(--rust);transform:translateY(-1px)}
.card .ln{color:var(--rust);font-weight:700;font-size:13px}
.card .tx{font-size:16px;color:var(--ink)}
.card .st{font-size:12px;color:var(--mute);white-space:nowrap}
.card .st.done{color:var(--green);font-weight:600}
.card .st.part{color:var(--gold);font-weight:600}
.card .tag{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin-top:3px}

/* sentence view */
.sticky{position:sticky;top:0;z-index:20;background:var(--cream);padding:10px 0 8px;border-bottom:2px solid var(--line);margin-bottom:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--mute)}
.bar button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--slate)}
.bar button:hover{border-color:var(--slate)}
.sent{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.vline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;padding:3px 0}
.vline .no{width:34px;font-size:11px;color:var(--mute);flex:none;font-family:inherit}
.chip{display:inline-block;padding:2px 6px;border-radius:7px;border:1px solid transparent;cursor:pointer;font-size:20px;line-height:1.35;user-select:none;transition:background .12s}
.chip:hover{background:var(--pale);border-color:#c9d4dc}
.chip.hi{background:#fff4d6;border-color:var(--gold)}
.chip.verb{background:var(--greenbg);border-color:var(--green);color:var(--green);font-weight:700}
.chip.subj{background:#e6eef7;border-color:var(--slate);color:var(--slate);font-weight:700}
.chip.no{background:var(--redbg);border-color:#e3b3aa;color:var(--red)}
.hint{font-size:12.5px;color:var(--mute);margin-top:6px}

/* steps */
.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;position:relative}
.step.locked{opacity:.5;pointer-events:none;filter:grayscale(.4)}
.step h2{margin:0 0 6px;font-size:15px;color:var(--slate);display:flex;align-items:center;gap:10px}
.step h2 .n{background:var(--slate);color:#fff;border-radius:999px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;flex:none}
.step.done h2 .n{background:var(--green)}
.step p{margin:6px 0;font-size:14.5px}
.fb{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:14px;display:none}
.fb.ok{display:block;background:var(--greenbg);border-left:4px solid var(--green)}
.fb.bad{display:block;background:var(--redbg);border-left:4px solid var(--red)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;cursor:pointer;font-size:13.5px;color:var(--slate);margin-top:6px}
.btn:hover{border-color:var(--slate)}
.btn.primary{background:var(--slate);color:#fff;border-color:var(--slate)}
.btn.primary:hover{background:#243a48}
.btn[disabled]{opacity:.45;cursor:default}
.chunks{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.chunk{display:grid;grid-template-columns:minmax(150px,1fr) 1.3fr;gap:6px 14px;padding:8px 12px;border-radius:9px;background:var(--pale);border-left:3px solid var(--slate);animation:pop .25s ease}
.chunk .cl{font-size:17px}
.chunk .ce{font-size:14.5px}
.chunk .cn{grid-column:1/-1;font-size:12.5px;color:var(--mute)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.model{margin-top:10px;background:var(--purplebg);border-left:4px solid var(--purple);padding:12px 14px;border-radius:9px;font-size:15px;display:none}
.model.show{display:block}
.model .shape{font-size:13.5px;color:#3d2d5c;margin-top:8px;padding-top:8px;border-top:1px dashed #c8bde0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.spacer{height:40vh}

/* popover */
#pop{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:12px 14px;max-width:360px;min-width:220px;font-size:14px;display:none}
#pop.show{display:block}
#pop .w{font-size:20px;color:var(--rust);margin-bottom:2px}
#pop .lem{font-style:italic;color:var(--slate);font-size:14px}
#pop .row{margin-top:6px}
#pop .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute);display:block}
#pop .warn{background:#fff4d6;border-left:3px solid var(--gold);padding:5px 8px;border-radius:6px;font-size:13px;margin-top:6px}
#pop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#pop .acts .btn{margin-top:0;padding:6px 10px;font-size:13px}
#pop .x{position:absolute;top:6px;right:8px;border:0;background:transparent;font-size:18px;color:var(--mute);cursor:pointer}
#pop .ety{font-size:14px}
#pop .ety .lang{color:var(--mute);font-size:12.5px;display:block;margin-top:3px}
#pop .off{color:var(--mute);font-size:13px}
#pop .amb{background:#fff4d6;border-radius:4px;padding:0 3px}
@media (max-width:600px){
  .chip{font-size:18px}
  .card{grid-template-columns:56px 1fr;grid-auto-rows:auto}
  .card .st{grid-column:1/-1}
  #pop{left:8px!important;right:8px;max-width:none;bottom:8px;top:auto!important}
  .chunk{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>Georgics 1.231–251 <small>Stuck on a sentence? Pick it from the list and work through it the way we do in lessons.</small></h1>
  <div class="modes">
    <span class="lbl">Word help:</span>
    <div class="seg" id="modeSeg">
      <button data-m="off" class="on">Off</button>
      <button data-m="mean">Meaning</button>
      <button data-m="parse">Parse</button>
      <button data-m="ety">Etymology</button>
    </div>
  </div>
</header>

<main>
  <div id="viewIndex"></div>
  <div id="viewSent" style="display:none"></div>
</main>

<div id="pop"></div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const TEXT = {
231:"Idcirco certis dimensum partibus orbem",
232:"per duodena regit mundi sol aureus astra.",
233:"quinque tenent caelum zonae: quarum una corusco",
234:"semper sole rubens et torrida semper ab igni;",
235:"quam circum extremae dextra laevaque trahuntur",
236:"caeruleae, glacie concretae atque imbribus atris;",
237:"has inter mediamque duae mortalibus aegris",
238:"munere concessae divum, et via secta per ambas,",
239:"obliquus qua se signorum verteret ordo.",
240:"mundus, ut ad Scythiam Riphaeasque arduus arces",
241:"consurgit, premitur Libyae devexus in Austros.",
242:"hic vertex nobis semper sublimis; at illum",
243:"sub pedibus Styx atra videt Manesque profundi.",
244:"maximus hic flexu sinuoso elabitur Anguis",
245:"circum perque duas in morem fluminis Arctos,",
246:"Arctos Oceani metuentis aequore tingi.",
247:"illic, ut perhibent, aut intempesta silet nox",
248:"semper et obtenta densentur nocte tenebrae;",
249:"aut redit a nobis Aurora diemque reducit,",
250:"nosque ubi primus equis Oriens adflavit anhelis",
251:"illic sera rubens accendit lumina Vesper."
};

/* Each sentence: lines = [[lineNo, "text"], ...] — a line may be partial.
   verb: accepted main-verb forms (lower-case, no punctuation); none:true = verbless.
   vno: specific feedback for tempting wrong picks. subj / sno likewise.
   chunks: construe order. model: translation. shape: note. */
const SENT = [
{ id:"s1", ref:"231–232", lines:[[231,TEXT[231]],[232,TEXT[232]]],
  verb:["regit"], vwhy:"<b>regit</b> — 3rd person singular, present indicative: <i>rules</i>. It is the only finite verb here, and everything else hangs from it.",
  vno:{ dimensum:"<b>dimensum</b> is a perfect participle (<i>measured out</i>). It describes <i>orbem</i>; it has no person ending, so it cannot be the main verb."},
  subj:["sol"], swhy:"<b>sol</b> (nominative singular, masculine) — <i>the sun</i>. <b>aureus</b> agrees with it: <i>the golden sun</i>.",
  sno:{ aureus:"<b>aureus</b> describes the subject — it is the adjective <i>golden</i>. Find the noun it agrees with.", orbem:"<b>orbem</b> is accusative — it is the object of <i>regit</i>, the thing being ruled.", astra:"<b>astra</b> is accusative plural after <i>per</i>: <i>through the … stars</i>. Not the subject.", mundi:"<b>mundi</b> is genitive — <i>of the heaven</i>. Genitives are never subjects."},
  chunks:[
    {l:"Idcirco",e:"For that reason",n:"Looks back to the lines before: because the sun's course marks out the seasons."},
    {l:"sol aureus",e:"the golden sun",n:"Subject."},
    {l:"regit",e:"rules / steers",n:"Main verb."},
    {l:"orbem … dimensum certis partibus",e:"the sphere, measured out in fixed parts",n:"Object + participle agreeing with it. <i>certis partibus</i>: ablative — <i>in/into fixed parts</i>."},
    {l:"per duodena … astra mundi",e:"through the twelve constellations of the heaven",n:"<i>per</i> + accusative; <i>mundi</i> genitive with <i>astra</i>. <i>mundus</i> here = the sky, not the earth."}
  ],
  model:"For that reason the golden sun rules the sphere, measured out in fixed parts, through the twelve constellations of the heaven.",
  shape:"Object first (<i>orbem</i>), verb in the middle, subject late (<i>sol aureus</i>), and the noun <i>astra</i> pushed to the very end away from its preposition <i>per</i>. Classic Virgilian word order: find the verb, then the nominative, then pair up the separated words."
},
{ id:"s2", ref:"233a", lines:[[233,"quinque tenent caelum zonae:"]],
  verb:["tenent"], vwhy:"<b>tenent</b> — 3rd person plural, present: <i>(they) hold</i>. The plural ending tells you to look for a plural subject.",
  vno:{},
  subj:["zonae"], swhy:"<b>zonae</b> — nominative plural: <i>zones</i>. It matches the plural verb <i>tenent</i>. <b>quinque</b> (<i>five</i>) goes with it.",
  sno:{ caelum:"<b>caelum</b> is accusative here — the sky is what is held. Which word is nominative plural to match <i>tenent</i>?", quinque:"<b>quinque</b> is the number <i>five</i> — it counts the subject but is not the noun itself."},
  chunks:[
    {l:"quinque … zonae",e:"five zones",n:"Subject, split around the verb."},
    {l:"tenent",e:"hold / occupy",n:""},
    {l:"caelum",e:"the sky",n:"Object."}
  ],
  model:"Five zones hold the sky:",
  shape:"A short statement that announces the topic of the next fifteen lines. The colon means what follows will explain the five zones one by one."
},
{ id:"s3", ref:"233b–234", lines:[[233,"quarum una corusco"],[234,TEXT[234]]],
  verb:[], none:true, noneLabel:"There is no finite verb — <i>est</i> is understood",
  vwhy:"Correct. There is no finite verb: <i>est</i> is left out, as Latin often does with a descriptive sentence. <i>rubens</i> and <i>torrida</i> describe the subject; <i>rubens</i> is a participle, <i>torrida</i> an adjective.",
  vno:{ rubens:"<b>rubens</b> is a present participle (<i>glowing red</i>) — a verb form, but with no person ending. It cannot be the main verb.", torrida:"<b>torrida</b> is an adjective (<i>scorched</i>). Is there any word with a person ending at all?"},
  subj:["una"], swhy:"<b>una</b> — nominative singular feminine: <i>one (zone)</i>. <i>quarum</i> = <i>of which (zones)</i>; so: <i>one of these</i>.",
  sno:{ quarum:"<b>quarum</b> is genitive plural — <i>of which</i>. It links back to the zones but is not the subject.", sole:"<b>sole</b> is ablative — <i>with/from the sun</i>. Look for the nominative."},
  chunks:[
    {l:"quarum una",e:"of these, one",n:"<i>quarum</i> is a 'connecting relative' — translate as <i>of these</i>."},
    {l:"[est]",e:"is",n:"Supply the verb."},
    {l:"semper rubens corusco sole",e:"always red with the flashing sun",n:"<i>corusco sole</i>: ablative of cause."},
    {l:"et semper torrida ab igni",e:"and always scorched by (its) fire",n:"<i>ab igni</i>: ablative after <i>ab</i>. Note the repetition of <i>semper</i>."}
  ],
  model:"of these, one is always red with the flashing sun and always scorched by its fire;",
  shape:"The torrid zone. Two balanced halves (<i>semper … semper</i>), each ending in the heat: <i>sole</i> … <i>igni</i>."
},
{ id:"s4", ref:"235–236", lines:[[235,TEXT[235]],[236,TEXT[236]]],
  verb:["trahuntur"], vwhy:"<b>trahuntur</b> — 3rd person plural, present <b>passive</b>: <i>are drawn / stretched</i>. Passive, so the subject is the thing being stretched.",
  vno:{ concretae:"<b>concretae</b> is a perfect participle (<i>frozen solid</i>) describing the zones. No person ending — not the main verb."},
  subj:["extremae","caeruleae"], swhy:"<b>extremae</b> (with <b>caeruleae</b>) — nominative plural feminine: <i>the outermost (zones), dark-blue</i>. The noun <i>zonae</i> is understood from 233.",
  sno:{ quam:"<b>quam</b> is accusative — it is governed by <i>circum</i>, which comes after it (<i>around which</i>).", glacie:"<b>glacie</b> is ablative — <i>with ice</i>.", dextra:"<b>dextra</b> is ablative — <i>on the right</i>. Find the nominative plural to match <i>trahuntur</i>."},
  chunks:[
    {l:"quam circum",e:"around which (one)",n:"The preposition comes <i>after</i> its noun (anastrophe). <i>quam</i> refers back to the torrid zone."},
    {l:"extremae … caeruleae",e:"the outermost (zones), dark-blue,",n:"Subject; supply <i>zonae</i>."},
    {l:"trahuntur",e:"are stretched",n:"Main verb, passive."},
    {l:"dextra laevaque",e:"on the right and on the left",n:"Ablatives of place."},
    {l:"concretae glacie atque imbribus atris",e:"frozen solid with ice and black rainstorms",n:"Participle agreeing with the subject; <i>glacie</i> and <i>imbribus atris</i> are ablatives of means."}
  ],
  model:"around this one the outermost zones, dark-blue, are stretched to right and left, frozen solid with ice and black rainstorms;",
  shape:"The two frozen zones. Note the postponed prepositions in this passage (<i>quam circum</i>, then <i>has inter</i> in 237) — expect the noun before the preposition."
},
{ id:"s5", ref:"237–239", lines:[[237,TEXT[237]],[238,TEXT[238]],[239,TEXT[239]]],
  verb:[], none:true, noneLabel:"No finite verb in the main clause — <i>sunt</i> / <i>est</i> understood",
  vwhy:"Correct. The main clause has no finite verb: <i>duae … concessae [sunt]</i> and <i>via secta [est]</i>. The only finite verb, <i>verteret</i>, is inside the <i>qua</i>-clause, so it cannot be the main verb.",
  vno:{ verteret:"<b>verteret</b> is finite, but it is imperfect <b>subjunctive</b> and belongs to the <i>qua</i>-clause (<i>along which … might turn</i>). It is subordinate, not the main verb.", concessae:"<b>concessae</b> is a perfect participle (<i>granted</i>). With <i>sunt</i> understood it forms the verb of the main clause — so what is the finite verb?", secta:"<b>secta</b> is a perfect participle (<i>cut</i>) with <i>est</i> understood. No finite verb is written."},
  subj:["duae"], swhy:"<b>duae</b> — nominative plural feminine: <i>two (zones)</i>. <i>concessae</i> agrees with it. The second clause has its own subject, <i>via</i>.",
  sno:{ via:"<b>via</b> is the subject of the second clause (<i>via secta [est]</i>). For the first clause, find the nominative that <i>concessae</i> agrees with.", ordo:"<b>ordo</b> is the subject of <i>verteret</i>, inside the subordinate clause.", has:"<b>has</b> is accusative — governed by <i>inter</i>, which follows it.", mediamque:"<b>mediam</b> is accusative, also governed by <i>inter</i>: <i>between these and the middle one</i>.", mortalibus:"<b>mortalibus</b> is dative — <i>to mortals</i>. The zones were granted <i>to</i> them.", divum:"<b>divum</b> is genitive plural (short for <i>divorum</i>): <i>of the gods</i>. Not an accusative singular."},
  chunks:[
    {l:"has inter mediamque",e:"between these and the middle one",n:"<i>inter</i> comes after <i>has</i>; it governs both <i>has</i> and <i>mediam</i>."},
    {l:"duae",e:"two (zones)",n:"Subject."},
    {l:"concessae [sunt]",e:"have been granted",n:"Participle + understood <i>sunt</i>."},
    {l:"mortalibus aegris",e:"to suffering mortals",n:"Dative (the form looks like an ablative; the sense — <i>granted to</i> — makes it dative)."},
    {l:"munere divum",e:"by the gift of the gods",n:"Ablative + genitive plural. <i>divum</i> = <i>divorum</i>."},
    {l:"et via secta [est] per ambas",e:"and a path has been cut through both",n:"Second clause. The 'path' is the ecliptic."},
    {l:"qua … ordo obliquus signorum",e:"along which the slanting order of the signs",n:"<i>qua</i> = <i>along which</i>; <i>ordo</i> is the subject of the clause."},
    {l:"se verteret",e:"might turn (itself)",n:"Imperfect subjunctive: purpose (<i>so that along it … might turn</i>)."}
  ],
  model:"between these and the middle one, two zones have been granted to suffering mortals by the gift of the gods, and a path has been cut through both, along which the slanting order of the signs might turn.",
  shape:"The two temperate zones. Two verbless main clauses (<i>sunt</i>, <i>est</i> understood) and then a purpose clause. The trap is <i>verteret</i>: finite, but subjunctive and subordinate."
},
{ id:"s6", ref:"240–241", lines:[[240,TEXT[240]],[241,TEXT[241]]],
  verb:["premitur"], vwhy:"<b>premitur</b> — 3rd person singular, present <b>passive</b>: <i>is pressed down</i>. <i>consurgit</i> is also finite, but it sits inside the <i>ut</i>-clause.",
  vno:{ consurgit:"<b>consurgit</b> is finite, but it is the verb of the <i>ut</i>-clause: <i>ut … consurgit</i> = <i>as it rises</i>. Look for the verb of the main clause."},
  subj:["mundus"], swhy:"<b>mundus</b> — nominative singular masculine: <i>the sky / the heavens</i>. It is the subject of both <i>consurgit</i> and <i>premitur</i>; <i>arduus</i> and <i>devexus</i> both agree with it.",
  sno:{ arduus:"<b>arduus</b> is an adjective agreeing with the subject (<i>steep</i>). Find the noun.", devexus:"<b>devexus</b> is an adjective agreeing with the subject (<i>sloping down</i>). Find the noun.", arces:"<b>arces</b> is accusative plural after <i>ad</i>: <i>to the heights</i>.", libyae:"<b>Libyae</b> is genitive — <i>of Libya</i>, going with <i>Austros</i>."},
  chunks:[
    {l:"mundus",e:"the sky",n:"Subject of the whole sentence."},
    {l:"ut … arduus consurgit",e:"as it rises steep",n:"<i>ut</i> + indicative = <i>as</i>. <i>arduus</i> is predicative: <i>rises (and is) steep</i>."},
    {l:"ad Scythiam Riphaeasque arces",e:"towards Scythia and the Rhipaean heights",n:"The far north."},
    {l:"premitur devexus",e:"(so) it is pressed down, sloping,",n:"Main verb + predicative adjective."},
    {l:"in Austros Libyae",e:"towards the south winds of Libya",n:"i.e. towards the far south."}
  ],
  model:"The sky, as it rises steep towards Scythia and the Rhipaean heights, is pressed down, sloping, towards the south winds of Libya.",
  shape:"A balanced 'as … so' picture of the tilted sky: north (<i>Scythiam</i>) high, south (<i>Austros</i>) low. <i>arduus</i> and <i>devexus</i> mirror each other."
},
{ id:"s7", ref:"242a", lines:[[242,"hic vertex nobis semper sublimis;"]],
  verb:[], none:true, noneLabel:"There is no finite verb — <i>est</i> is understood",
  vwhy:"Correct. <i>est</i> is understood: <i>this pole is always high above us</i>.",
  vno:{ sublimis:"<b>sublimis</b> is an adjective (<i>high, aloft</i>) agreeing with <i>vertex</i>. No verb is written."},
  subj:["vertex"], swhy:"<b>vertex</b> — nominative singular masculine: <i>pole</i> (the celestial pole). <i>hic</i> = <i>this</i> agrees with it.",
  sno:{ hic:"<b>hic</b> here is the demonstrative <i>this</i>, agreeing with the subject. Find the noun.", nobis:"<b>nobis</b> is dative — <i>for us</i>."},

const SKEY="georgics231_helper_v1";
let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem(SKEY)||"{}"); }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){} }
function st(id){ if(!state[id]) state[id]={verb:false,subj:false,chunk:0,model:false}; return state[id]; }

let mode = "off";
let cur = null; // current sentence object

const norm = w => w.toLowerCase().replace(/[^a-z]/g,"");
function lex(sid, w){ const f=norm(w); return OVR[sid+":"+f] || LEX[f] || null; }

/* ============================================================
   INDEX VIEW
   ============================================================ */
function renderIndex(){
  const v=document.getElementById("viewIndex");
  let h=`<div class="intro">
    <p><b>How to use this.</b> Find the sentence you are stuck on and click it. Work through the steps in order — main verb, subject, then the sentence in construe order — before you look at the model. Use the <b>Word help</b> switch at the top when you want to check a word: <i>Meaning</i> gives the dictionary sense, <i>Parse</i> the full grammar, <i>Etymology</i> only the words that have come from it (the meaning stays hidden until you ask).</p>
    <p style="color:var(--mute);font-size:13px">Virgil, <i>Georgics</i> 1.231–251 · the five zones of the sky and the two poles.</p>
  </div><div class="idx">`;
  SENT.forEach(s=>{
    const p=st(s.id);
    let status="not started", cls="";
    if(p.model){status="✓ done";cls="done";}
    else if(p.verb||p.subj||p.chunk>0){status="in progress";cls="part";}
    const first=s.lines.map(l=>l[1]).join(" ");
    h+=`<div class="card" onclick="openSent('${s.id}')">
      <div><div class="ln">${s.ref}</div><div class="tag">${s.none?"verbless":""}</div></div>
      <div class="tx lat">${first}</div>
      <div class="st ${cls}">${status}</div></div>`;
  });
  h+=`</div>`;
  v.innerHTML=h;
}

   ============================================================ */
function openSent(id){
  cur=SENT.find(s=>s.id===id);
  document.getElementById("viewIndex").style.display="none";
  const v=document.getElementById("viewSent"); v.style.display="block";
  renderSent(); window.scrollTo(0,0); hidePop();
}
function backToIndex(){
  cur=null; hidePop();
  document.getElementById("viewSent").style.display="none";
  document.getElementById("viewIndex").style.display="block";
  renderIndex(); window.scrollTo(0,0);
}
function chipsHTML(s){
  const p=st(s.id);
  return s.lines.map(([no,txt])=>{
    const words=txt.split(/\s+/).filter(Boolean).map((w,i)=>{
      const f=norm(w); let cls="chip lat";
      if(p.verb && s.verb.includes(f)) cls+=" verb";
      if(p.subj && s.subj.includes(f)) cls+=" subj";
      return `<span class="${cls}" data-w="${w.replace(/"/g,'&quot;')}" onclick="tapWord(event,this)">${w}</span>`;
    }).join("");
    return `<div class="vline"><span class="no">${no}</span>${words}</div>`;
  }).join("");
}
function renderSent(){
  const s=cur, p=st(s.id);
  const i=SENT.indexOf(s);
  const prev=SENT[i-1], next=SENT[i+1];
  const stepOpen = !p.verb ? 1 : !p.subj ? 2 : 3;
  let h=`<div class="sticky">
    <div class="bar"><button onclick="backToIndex()">‹ All sentences</button><span>Lines ${s.ref} · ${stepOpen===1?"Step 1: find the main verb":stepOpen===2?"Step 2: find the subject":"Steps 3–4: construe, then check"}</span></div>
    <div class="sent" id="sentBox">${chipsHTML(s)}</div>
    <div class="hint" id="hint">${mode==="off"?"Click a word to choose it. Turn on Word help above if you want to check a word first.":"Click any word for help. When a step is active, the popover also lets you choose that word as your answer."}</div>
  </div>`;

  // STEP 1
  h+=`<div class="step ${p.verb?"done":""}" id="step1"><h2><span class="n">1</span>Find the main verb</h2>
    <p>Click the finite verb of the main clause — the word with a person ending that is not inside a subordinate clause. If you think there is none, use the button.</p>
    <button class="btn" ${p.verb?"disabled":""} onclick="pickNoneVerb()">${s.noneLabel||"There is no finite verb"}</button>
    <div class="fb ${p.verb?"ok":""}" id="fb1">${p.verb?s.vwhy:""}</div></div>`;
  // STEP 2
  h+=`<div class="step ${p.subj?"done":""} ${!p.verb?"locked":""}" id="step2"><h2><span class="n">2</span>Find the subject</h2>
    <p>Click the nominative noun (or pronoun) that goes with the main verb. Check that its number matches the verb ending.</p>
    <button class="btn" ${p.subj?"disabled":""} onclick="pickNoneSubj()">Not stated — it is in the verb ending</button>
    <div class="fb ${p.subj?"ok":""}" id="fb2">${p.subj?s.swhy:""}</div></div>`;
  // STEP 3
  const shown=Math.min(p.chunk, s.chunks.length);
  h+=`<div class="step ${shown>=s.chunks.length?"done":""} ${!p.subj?"locked":""}" id="step3"><h2><span class="n">3</span>Construe in order</h2>
    <p>Now build the sentence in the order we would say it. Reveal one chunk at a time and try to translate it yourself before you read the English.</p>
    <div class="chunks" id="chunks">${s.chunks.slice(0,shown).map(chunkHTML).join("")}</div>
    <button class="btn primary" id="nextChunk" ${shown>=s.chunks.length?"disabled":""} onclick="nextChunk()">${shown===0?"Reveal first chunk":shown>=s.chunks.length?"All chunks shown":"Reveal next chunk ("+(shown+1)+"/"+s.chunks.length+")"}</button></div>`;
  // STEP 4
  h+=`<div class="step ${p.model?"done":""} ${shown<s.chunks.length?"locked":""}" id="step4"><h2><span class="n">4</span>Check against the model</h2>
    <p>Write your own version first, then compare.</p>
    <button class="btn" onclick="showModel()" ${p.model?"disabled":""}>Show model translation</button>
    <div class="model ${p.model?"show":""}" id="model"><b>${s.model}</b><div class="shape"><b>The shape of the sentence.</b> ${s.shape}</div></div></div>`;
  h+=`<div class="nav">
    <button class="btn" ${prev?"":"disabled"} onclick="openSent('${prev?prev.id:""}')">‹ ${prev?prev.ref:""}</button>
    <button class="btn" onclick="resetSent()">Reset this sentence</button>
    <button class="btn" ${next?"":"disabled"} onclick="openSent('${next?next.id:""}')">${next?next.ref:""} ›</button></div>
    <div class="spacer"></div>`;
  document.getElementById("viewSent").innerHTML=h;
}
function chunkHTML(c){ return `<div class="chunk"><div class="cl lat">${c.l}</div><div class="ce">${c.e}</div>${c.n?`<div class="cn">${c.n}</div>`:""}</div>`; }

function nextChunk(){ const p=st(cur.id); if(p.chunk<cur.chunks.length){p.chunk++; save(); renderSent(); const el=document.getElementById("nextChunk"); if(el) el.scrollIntoView({block:"center",behavior:"smooth"});} }
function showModel(){ const p=st(cur.id); p.model=true; save(); renderSent(); document.getElementById("model").scrollIntoView({block:"center",behavior:"smooth"}); }
function resetSent(){ state[cur.id]={verb:false,subj:false,chunk:0,model:false}; save(); renderSent(); }

/* answer handling */
function activeStep(){ const p=st(cur.id); return !p.verb?1:!p.subj?2:0; }
function fb(n, ok, msg){ const el=document.getElementById("fb"+n); el.className="fb "+(ok?"ok":"bad"); el.innerHTML=msg; }
function flashChip(w, cls){ document.querySelectorAll("#sentBox .chip").forEach(c=>{ if(norm(c.dataset.w)===norm(w)){ c.classList.add(cls); setTimeout(()=>c.classList.remove(cls),900);} }); }

function answerVerb(w){
  const s=cur, p=st(s.id), f=norm(w);
  if(s.verb.includes(f)){ p.verb=true; save(); renderSent(); fb(1,true,s.vwhy); document.getElementById("step2").scrollIntoView({block:"start",behavior:"smooth"}); return; }
  flashChip(w,"no");
  let msg = s.vno[f];
  if(!msg){ const L=lex(s.id,w); msg = L ? `<b>${w.replace(/[.,;:]+$/,"")}</b> ${KIND[L.k]||"is not the main verb."}` : `Not this one — try again.`; }
  fb(1,false,msg);
}
function pickNoneVerb(){
  const s=cur, p=st(s.id);
  if(s.none){ p.verb=true; save(); renderSent(); fb(1,true,s.vwhy); document.getElementById("step2").scrollIntoView({block:"start",behavior:"smooth"}); }
  else fb(1,false,`There is a finite verb here. Look for an ending in <i>-t</i>, <i>-nt</i>, <i>-tur</i> or <i>-ntur</i> that is not inside a subordinate clause (after <i>ut</i>, <i>ubi</i>, <i>qua</i> …).`);
}
function answerSubj(w){
  const s=cur, p=st(s.id), f=norm(w);
  if(s.subj.includes(f)){ p.subj=true; save(); renderSent(); fb(2,true,s.swhy); document.getElementById("step3").scrollIntoView({block:"start",behavior:"smooth"}); return; }
  flashChip(w,"no");
  let msg = s.sno[f];
  if(!msg){ const L=lex(s.id,w); msg = L ? `<b>${w.replace(/[.,;:]+$/,"")}</b> ${SKIND[L.k]||"is not the subject."}` : `Not this one — try again.`; }
  fb(2,false,msg);
}
function pickNoneSubj(){ fb(2,false,`The subject is stated here — there is a nominative noun in the sentence. Find it.`); }

/* ============================================================
   WORD TAP + POPOVER
   ============================================================ */
let popWord=null, popEl=null;
function tapWord(ev, el){
  ev.stopPropagation();
  const w=el.dataset.w, step=activeStep();
  if(mode==="off"){
    if(step===1) return answerVerb(w);
    if(step===2) return answerSubj(w);
    return; // nothing to do
  }
  showPop(el, w, step);
}
function showPop(el, w, step, revealMeaning){
  const L=lex(cur.id,w); const pop=document.getElementById("pop");
  const clean=w.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,"");
  let body=`<button class="x" onclick="hidePop()">×</button><div class="w lat">${clean}</div>`;
  if(!L){ body+=`<div class="off">No entry for this word.</div>`; }
  else if(mode==="mean"){
    body+=`<div class="lem">${L.l}</div><div class="row"><span class="k">meaning</span>${L.m}</div>`;
  } else if(mode==="parse"){
    body+=`<div class="lem">${L.l}</div>
      <div class="row"><span class="k">parse</span>${L.p}</div>
      <div class="row"><span class="k">meaning</span>${L.m}</div>
      ${L.n?`<div class="warn">${L.n}</div>`:""}`;
  } else if(mode==="ety"){
    body+=`<div class="row ety"><span class="k">words that come from it</span>${L.e}</div>`;
    if(revealMeaning) body+=`<div class="row"><span class="k">meaning</span><span class="lem">${L.l}</span><br>${L.m}</div>`;
    else body+=`<div class="acts"><button class="btn" onclick="showPop(popEl,'${w.replace(/'/g,"\\'")}',${step},true)">Show meaning</button></div>`;
  }
  if(step===1) body+=`<div class="acts"><button class="btn primary" onclick="hidePop();answerVerb('${w.replace(/'/g,"\\'")}')">This is the main verb</button></div>`;
  if(step===2) body+=`<div class="acts"><button class="btn primary" onclick="hidePop();answerSubj('${w.replace(/'/g,"\\'")}')">This is the subject</button></div>`;
  pop.innerHTML=body; pop.classList.add("show");
  popWord=w; popEl=el;
  document.querySelectorAll("#sentBox .chip.hi").forEach(c=>c.classList.remove("hi")); el.classList.add("hi");
  position(el);
}
function position(el){
  const pop=document.getElementById("pop");
  if(window.innerWidth<=600){ pop.style.left="8px"; pop.style.top="auto"; return; }
  const r=el.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=Math.max(8, Math.min(r.left, window.innerWidth-pw-8));
  let top=r.bottom+8; if(top+ph>window.innerHeight-8) top=Math.max(8, r.top-ph-8);
  pop.style.left=left+"px"; pop.style.top=top+"px";
}
function hidePop(){ document.getElementById("pop").classList.remove("show"); document.querySelectorAll("#sentBox .chip.hi").forEach(c=>c.classList.remove("hi")); }
document.addEventListener("click", e=>{ if(!e.target.closest("#pop") && !e.target.closest(".chip")) hidePop(); });
window.addEventListener("scroll", ()=>{ if(popEl && document.getElementById("pop").classList.contains("show")) position(popEl); }, {passive:true});
window.addEventListener("resize", ()=>{ if(popEl) position(popEl); });

/* mode switch */
document.querySelectorAll("#modeSeg button").forEach(b=>b.addEventListener("click",()=>{
  mode=b.dataset.m; document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.toggle("on",x===b));
  hidePop(); const h=document.getElementById("hint"); if(h) h.textContent = mode==="off" ? "Click a word to choose it. Turn on Word help above if you want to check a word first." : "Click any word for help. When a step is active, the popover also lets you choose that word as your answer.";
}));

/* sanity: every token has a lexicon entry (log only) */
(function(){ const missing=new Set(); SENT.forEach(s=>s.lines.forEach(([n,t])=>t.split(/\s+/).filter(Boolean).forEach(w=>{ if(!lex(s.id,w)) missing.add(w); }))); if(missing.size) console.warn("Missing LEX:", [...missing]); })();

renderIndex();
</script>
